@if (service.member(); as member) {
  <div class="flex flex-col gap-3">
    <div class="flex gap-3">
      <span class="font-semibold">Member since:</span>
      <span>{{ member.created | date: "longDate" }}</span>
    </div>
    <div class="flex gap-3">
      <span class="font-semibold">Last active:</span>
      <span>{{ member.lastActive | date: "MMM dd, yyyy, hh:mm a" }}</span>
    </div>
    <h3 class="text-lg font-semibold text-primary">About {{ member.displayName }}</h3>

    @if (service.editMode()) {
      <form #editForm="ngForm" (ngSubmit)="updateProfile()" class="flex flex-col w-full gap-4">
        <label class="floating-label">
          <span>Display name</span>
          <input
            type="text"
            class="input w-full"
            name="displayName"
            [(ngModel)]="editableMember.displayName"
            placeholder="Display name"
          />
        </label>
        <div class="w-full flex gap-3">
          <label class="w-full floating-label">
            <span>City</span>
            <input
              type="text"
              class="input w-full"
              name="city"
              [(ngModel)]="editableMember.city"
              placeholder="City"
            />
          </label>
          <label class="w-full floating-label">
            <span>Country</span>
            <input
              type="text"
              class="input w-full"
              name="country"
              [(ngModel)]="editableMember.country"
              placeholder="Country"
            />
          </label>
        </div>
        <label class="floating-label">
          <span>Description</span>
          <textarea
            type="text"
            class="textarea w-full"
            name="description"
            [(ngModel)]="editableMember.description"
            placeholder="Description"
          ></textarea>
        </label>

        <div class="flex self-end">
          <button type="submit" class="btn btn-success">Submit</button>
        </div>
      </form>
    } @else {
      <div>{{ member.description }}</div>
    }
  </div>
}
