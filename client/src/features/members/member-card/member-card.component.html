@if (member(); as member) {
  <div
    routerLink="/members/{{ member.id }}"
    class="card cursor-pointer transition-all duration-300 ease-in-out transform hover:-translate-y-2 relative z-1"
  >
    @if (member.imageUrl) {
      <img src="{{ member.imageUrl }}" alt="{{ member.displayName }}" class="rounded-lg" />
    } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-full rounded-lg"
      >
        <path
          fill-rule="evenodd"
          d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
          clip-rule="evenodd"
        />
      </svg>
    }
    <button class="absolute top-1 right-1 z-50 btn btn-ghost btn-circle">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        [attr.fill]="hasLiked() ? 'red' : 'none'"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-7"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
        />
      </svg>
    </button>

    <div
      class="card-actions absolute bottom-0 w-full px-3 py-1 rounded-b-lg bg-linear-to-t from-base-300 via-base-300/75 to-base-300/0"
    >
      <div class="flex flex-col text-base-content">
        <span class="font-semibold">{{ member.displayName }}, {{ member.dateOfBirth | age }}</span>
        <span class="text-sm">{{ member.city }}</span>
      </div>
    </div>
  </div>
}
