@if (member(); as member) {
  <div class="flex gap-6">
    <div class="card bg-base-200 flex-col h-[85vh] w-1/4 p-2">
      @if (member.imageUrl) {
        <img
          src="{{ member.imageUrl }}"
          alt="image of member"
          class="rounded-full mx-10 mt-3 object-cover"
        />
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-full rounded-full mx-10 mt-3 object-cover"
        >
          <path
            fill-rule="evenodd"
            d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
            clip-rule="evenodd"
          />
        </svg>
      }
      <div class="card-body">
        <div class="flex flex-col items-center">
          <div class="flex text-2xl text-primary">
            {{ member.displayName }}, {{ member.dateOfBirth | age }}
          </div>

          <div class="text-sm">{{ member.city }}, {{ member.country }}</div>
        </div>

        <div class="divider"></div>

        <ul class="menu rounded-box w-full text-xl">
          <li><a routerLink="profile" routerLinkActive="text-primary">Profile</a></li>
          <li><a routerLink="photos" routerLinkActive="text-primary">Photos</a></li>
          <li><a routerLink="messages" routerLinkActive="text-primary">Messages</a></li>
        </ul>
      </div>
      <div class="card-actions justify-between gap-2 px-2 mb-3">
        <button class="btn btn-info flex-1">Go back</button>
        <button class="btn btn-primary flex-1">Like</button>
      </div>
    </div>

    <div class="card bg-base-300 w-3/4 p-6">
      <h3 class="card-title text-3xl text-primary">{{ title() }}</h3>
      <div class="divider"></div>
      <div>
        <router-outlet />
      </div>
    </div>
  </div>
} @else {
  <app-not-found />
}
