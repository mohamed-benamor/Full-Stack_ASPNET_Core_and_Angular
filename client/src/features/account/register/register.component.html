<div class="card bg-base-300 min-w-sm mx-auto flex flex-col p-4 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <form [formGroup]="registerForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
      <label class="floating-label">
        <span>Display name</span>
        <input
          type="text"
          class="input w-full"
          formControlName="displayName"
          placeholder="Display name"
        />
      </label>

      <label class="floating-label">
        <span>Email</span>
        <input type="email" class="input w-full" formControlName="email" placeholder="Email" />
      </label>

      <label class="floating-label">
        <span>Password</span>
        <input
          type="password"
          class="input w-full"
          formControlName="password"
          placeholder="Password"
        />
      </label>

      <label class="floating-label">
        <span>Confirm password</span>
        <input
          type="password"
          class="input w-full"
          formControlName="confirmPassword"
          placeholder="Confirm password"
        />
      </label>

      <div class="flex items-center justify-end gap-3">
        <button (click)="cancel()" type="button" class="btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>

  <div class="flex flex-col items-start px-3 w-full mockup-code text-lg">
    <div>Form value {{ registerForm.value | json }}</div>
    <div>Form status {{ registerForm.status | json }}</div>
  </div>
</div>
