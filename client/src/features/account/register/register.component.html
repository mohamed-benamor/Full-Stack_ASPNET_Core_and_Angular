<div class="card bg-base-300 min-w-sm mx-auto flex flex-col p-4 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
      <input
        type="text"
        class="input w-full"
        name="display-name"
        [(ngModel)]="credentials['display-name']"
        placeholder="Display name"
      />
      <input
        type="email"
        class="input w-full"
        name="email"
        [(ngModel)]="credentials['email']"
        placeholder="Email"
      />
      <input
        type="password"
        class="input w-full"
        name="password"
        [(ngModel)]="credentials['password']"
        placeholder="Password"
      />

      <div class="flex items-center justify-end gap-3">
        <button (click)="cancel()" type="button" class="btn">Cancel</button>
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>
</div>
