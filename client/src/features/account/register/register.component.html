<div class="card bg-base-300 min-w-sm mx-auto flex flex-col p-4 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-primary">Credentials</li>
      <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
    </ul>

    @switch (currentStep()) {
      @case (1) {
        <form [formGroup]="credentialsForm" class="flex flex-col gap-4 w-full">
          <app-text-input type="text" label="Display name" formControlName="displayName" />
          <app-text-input type="email" label="Email" formControlName="email" />
          <app-text-input type="password" label="Password" formControlName="password" />
          <app-text-input
            type="password"
            label="Confirm password"
            formControlName="confirmPassword"
          />

          <div class="flex items-center justify-end gap-3">
            <button (click)="cancel()" type="button" class="btn">Cancel</button>
            <button
              (click)="nextStep()"
              [disabled]="!credentialsForm.valid"
              class="btn btn-primary"
            >
              Next
            </button>
          </div>
        </form>
      }
      @case (2) {
        <form [formGroup]="profileForm" class="flex flex-col gap-4 w-full">
          <app-text-input
            [maxDate]="getMaxDate()"
            type="date"
            label="Date of birth"
            formControlName="dateOfBirth"
          />
          <app-text-input type="text" label="City" formControlName="city" />
          <app-text-input type="text" label="Country" formControlName="country" />

          <div class="flex items-center gap-4">
            <div class="font-semibold">Gender:</div>
            <label class="flex gap-3 items-center">
              <span>Male</span>
              <input
                type="radio"
                formControlName="gender"
                value="male"
                class="radio radio-primary"
              />
            </label>
            <label class="flex gap-3 items-center">
              <span>Female</span>
              <input
                type="radio"
                formControlName="gender"
                value="female"
                class="radio radio-primary"
              />
            </label>
          </div>

          <div class="flex items-center justify-end gap-3">
            <button (click)="prevStep()" type="button" class="btn">Back</button>
            <button (click)="register()" [disabled]="!profileForm.valid" class="btn btn-primary">
              Register
            </button>
          </div>
        </form>
      }
    }
  </div>

  @if (validationErrors().length > 0) {
    <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
      <ul class="flex flex-col text-error space-y-1">
        @for (error of validationErrors(); track $index) {
          <li>{{ error }}</li>
        }
      </ul>
    </div>
  }
</div>
