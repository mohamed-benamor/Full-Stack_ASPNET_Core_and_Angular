<div class="card bg-base-300 min-w-sm mx-auto flex flex-col p-4 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <form [formGroup]="registerForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
      <app-text-input type="text" label="Display name" formControlName="displayName" />
      <app-text-input type="email" label="Email" formControlName="email" />
      <app-text-input type="password" label="Password" formControlName="password" />
      <app-text-input type="password" label="Confirm password" formControlName="confirmPassword" />

      <div class="flex items-center justify-end gap-3">
        <button (click)="cancel()" type="button" class="btn">Cancel</button>
        <button [disabled]="!registerForm.valid" type="submit" class="btn btn-primary">
          Register
        </button>
      </div>
    </form>
  </div>

  <div class="flex flex-col items-start px-3 w-full mockup-code text-lg">
    <div>Form value {{ registerForm.value | json }}</div>
    <div>Form status {{ registerForm.status | json }}</div>
  </div>
</div>
